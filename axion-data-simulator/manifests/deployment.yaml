apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-simulator
spec:
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
      - name: axion-simulator-container
        image: brijendra.azurecr.io/axion-simulator:878
        ports:
        - containerPort: 8000
