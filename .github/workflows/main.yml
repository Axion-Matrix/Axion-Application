name: Deploy Axion UI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Axion-Cluster
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # 3. Create kubeconfig
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"

          echo "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

      # 4. Check available Kubernetes contexts
      - name: Check Kubernetes Contexts
        run: |
          echo "Available Kubernetes contexts:"
          kubectl config get-contexts

      # 5. Select Axion-Cluster
      - name: Select Axion-Cluster
        run: |
          kubectl config use-context Axion-Cluster

      # 6. Verify Kubernetes connection
      - name: Verify Kubernetes Connection
        run: |
          echo "Current Kubernetes Context:"
          kubectl config current-context

          echo "Kubernetes Cluster:"
          kubectl cluster-info

          echo "Cluster Nodes:"
          kubectl get nodes

      # 7. Deploy manifests
      - name: Deploy Axion UI
        run: |
          kubectl apply -f axion-ui/manifests/

      # 8. Check resources
      - name: Check Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      # 9. Wait for rollout
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/axion-ui --timeout=180s
