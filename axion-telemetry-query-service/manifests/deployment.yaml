apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-telemetry-deployment
spec:
  selector:
    matchLabels:
      app: telemetry-service
  template:
    metadata:
      labels:
        app: telemetry-service
    spec:
      containers:
      - name: telemetry-container
        image: brijendra.azurecr.io/axion-telemetry-service-image:5
        ports:
        - containerPort: 8000
