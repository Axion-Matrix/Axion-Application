name: Deploy Axion UI to Kubernetes

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Axion-Cluster
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # 3. Create kubeconfig directory
      - name: Create Kubernetes Config Directory
        run: |
          mkdir -p ~/.kube

      # 4. Configure Kubernetes connection
      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      # 5. Verify Kubernetes connection
      - name: Verify Kubernetes Cluster
        run: |
          echo "Current Kubernetes Context:"
          kubectl config current-context

          echo "Kubernetes Cluster:"
          kubectl cluster-info

          echo "Cluster Nodes:"
          kubectl get nodes

      # 6. Select Axion-Cluster context
      - name: Select Axion-Cluster
        run: |
          kubectl config use-context Axion-Cluster

      # 7. Verify selected cluster
      - name: Verify Axion-Cluster
        run: |
          echo "Connected Cluster:"
          kubectl config current-context

          kubectl get nodes

      # 8. Apply Axion UI Kubernetes manifests
      - name: Deploy Axion UI
        run: |
          kubectl apply -f axion-ui/manifests/

      # 9. Check deployment
      - name: Check Deployment Status
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      # 10. Wait for rollout
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/axion-ui --timeout=180s
